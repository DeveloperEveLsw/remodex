name: Android Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets
        run: |
          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Decode release keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/remodex-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x AndroidClient/gradlew

      - name: Build signed release APK
        working-directory: AndroidClient
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect release APK
        id: apk
        run: |
          APK_PATH="$(find AndroidClient/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unaligned*' ! -name '*unsigned.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not found"
            exit 1
          fi

          APK_NAME="remodex-android-${RELEASE_TAG}.apk"
          RENAMED_PATH="$RUNNER_TEMP/$APK_NAME"
          cp "$APK_PATH" "$RENAMED_PATH"

          echo "path=$RENAMED_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Upload APK to GitHub Release
        uses: actions/github-script@v7
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          script: |
            const fs = require('fs');

            const apkName = process.env.APK_NAME;
            const apkPath = process.env.APK_PATH;
            const { owner, repo } = context.repo;
            const releaseId = context.payload.release.id;

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });

            const existingAsset = assets.find((asset) => asset.name === apkName);
            if (existingAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existingAsset.id,
              });
            }

            const data = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: apkName,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
              data,
            });
